<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Design preview of Histiva on-premise server console">
  <defs>
    <filter id="os" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0c2461" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="400" height="250" fill="#f8fafc"/>

  <!-- monitor bezel -->
  <g filter="url(#os)">
    <rect x="20" y="14" width="360" height="200" rx="8" fill="#0f172a"/>
    <rect x="28" y="22" width="344" height="184" rx="3" fill="#ffffff"/>
  </g>

  <!-- monitor stand -->
  <path d="M 170 214 L 230 214 L 240 240 L 160 240 Z" fill="#cbd5e1"/>
  <rect x="140" y="238" width="120" height="4" rx="2" fill="#94a3b8"/>

  <!-- server admin UI -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- header -->
    <rect x="28" y="22" width="344" height="22" fill="#0c2461"/>
    <text x="38" y="36" font-size="9" font-weight="700" fill="#ffffff">Histiva · Local Admin</text>
    <circle cx="350" cy="33" r="3" fill="#10b981"/>
    <text x="334" y="36" font-size="7" fill="#dbeafe" text-anchor="end">root@clinic-server</text>

    <!-- left sidebar -->
    <rect x="28" y="44" width="80" height="162" fill="#f1f5f9"/>
    <g font-size="7" fill="#0f172a">
      <rect x="32" y="50" width="72" height="14" rx="2" fill="#1e40af"/>
      <text x="40" y="60" fill="#ffffff" font-weight="600">System</text>

      <text x="40" y="76">Network</text>
      <text x="40" y="90">Backups</text>
      <text x="40" y="104">Updates</text>
      <text x="40" y="118">Users</text>
      <text x="40" y="132">Audit log</text>
      <text x="40" y="146">Database</text>
      <text x="40" y="160">Hardware</text>
    </g>

    <!-- main content -->
    <g transform="translate(116, 50)">
      <text x="0" y="10" font-size="9" font-weight="700" fill="#0c2461">System overview</text>

      <!-- status row -->
      <g transform="translate(0, 22)">
        <rect width="76" height="40" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="8" y="14" font-size="6" fill="#16a34a" letter-spacing="0.6">UPTIME</text>
        <text x="8" y="30" font-size="11" font-weight="700" fill="#16a34a">12d 4h</text>
      </g>
      <g transform="translate(82, 22)">
        <rect width="76" height="40" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
        <text x="8" y="14" font-size="6" fill="#1e40af" letter-spacing="0.6">DB SIZE</text>
        <text x="8" y="30" font-size="11" font-weight="700" fill="#1e40af">8.4 GB</text>
      </g>
      <g transform="translate(164, 22)">
        <rect width="76" height="40" rx="4" fill="#fef3c7" stroke="#fcd34d"/>
        <text x="8" y="14" font-size="6" fill="#b45309" letter-spacing="0.6">DISK FREE</text>
        <text x="8" y="30" font-size="11" font-weight="700" fill="#b45309">42%</text>
      </g>

      <!-- backup section -->
      <text x="0" y="86" font-size="8" font-weight="700" fill="#0c2461">Last backup</text>
      <text x="0" y="100" font-size="8" fill="#475569">2 hours ago · 8.2 GB · ✓ verified</text>

      <text x="0" y="120" font-size="8" font-weight="700" fill="#0c2461">Schedule</text>
      <text x="0" y="134" font-size="8" fill="#475569">Daily 02:00 local · keeps last 30</text>

      <text x="0" y="154" font-size="8" font-weight="700" fill="#0c2461">Sync to cloud</text>
      <g transform="translate(0, 158)">
        <rect x="62" y="0" width="20" height="10" rx="5" fill="#cbd5e1"/>
        <circle cx="67" cy="5" r="4" fill="#ffffff"/>
      </g>
      <text x="86" y="166" font-size="8" fill="#475569">Off — fully local</text>
    </g>
  </g>

  <!-- preview badge -->
  <g transform="translate(290, 48)">
    <rect width="76" height="14" rx="7" fill="#1e40af"/>
    <text x="38" y="10" font-family="ui-sans-serif, system-ui, sans-serif" font-size="6" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">DESIGN PREVIEW</text>
  </g>
</svg>
