<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Design preview of the MediSina dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0c2461" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- browser window -->
  <g filter="url(#shadow)">
    <rect x="40" y="32" width="1120" height="680" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="40" y="32" width="1120" height="44" rx="14" fill="#e2e8f0"/>
    <rect x="40" y="62" width="1120" height="14" fill="#e2e8f0"/>

    <!-- traffic lights -->
    <circle cx="72" cy="54" r="6" fill="#ef4444"/>
    <circle cx="92" cy="54" r="6" fill="#f59e0b"/>
    <circle cx="112" cy="54" r="6" fill="#10b981"/>

    <!-- URL bar -->
    <rect x="360" y="44" width="520" height="20" rx="10" fill="#ffffff"/>
    <text x="378" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#475569">medisina.app/dashboard</text>
  </g>

  <!-- sidebar -->
  <rect x="40" y="76" width="220" height="636" fill="#0c2461"/>
  <text x="64" y="116" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">MediSina</text>
  <text x="64" y="135" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#93c5fd" letter-spacing="1.2">HBYS · v1.0</text>

  <!-- sidebar nav items -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#dbeafe">
    <rect x="56" y="168" width="188" height="32" rx="6" fill="#1e40af"/>
    <circle cx="74" cy="184" r="6" fill="#93c5fd"/>
    <text x="92" y="188" fill="#ffffff" font-weight="600">Dashboard</text>

    <circle cx="74" cy="220" r="6" fill="#3b82f6" opacity="0.5"/>
    <text x="92" y="224">Patients</text>

    <circle cx="74" cy="252" r="6" fill="#3b82f6" opacity="0.5"/>
    <text x="92" y="256">Admissions</text>

    <circle cx="74" cy="284" r="6" fill="#3b82f6" opacity="0.5"/>
    <text x="92" y="288">Outpatient</text>

    <circle cx="74" cy="316" r="6" fill="#3b82f6" opacity="0.5"/>
    <text x="92" y="320">Emergency</text>

    <circle cx="74" cy="348" r="6" fill="#3b82f6" opacity="0.5"/>
    <text x="92" y="352">Inpatient</text>

    <circle cx="74" cy="380" r="6" fill="#3b82f6" opacity="0.5"/>
    <text x="92" y="384">Laboratory</text>

    <circle cx="74" cy="412" r="6" fill="#3b82f6" opacity="0.5"/>
    <text x="92" y="416">Radiology</text>

    <circle cx="74" cy="444" r="6" fill="#3b82f6" opacity="0.5"/>
    <text x="92" y="448">Pharmacy</text>

    <circle cx="74" cy="476" r="6" fill="#3b82f6" opacity="0.5"/>
    <text x="92" y="480">Inventory</text>

    <circle cx="74" cy="508" r="6" fill="#3b82f6" opacity="0.5"/>
    <text x="92" y="512">Billing</text>
  </g>

  <!-- divider -->
  <line x1="56" y1="640" x2="244" y2="640" stroke="#1e40af" stroke-width="1"/>
  <circle cx="76" cy="668" r="12" fill="#3b82f6"/>
  <text x="76" y="672" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#ffffff" font-weight="700" text-anchor="middle">DR</text>
  <text x="98" y="664" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#ffffff" font-weight="600">Dr. Adamu</text>
  <text x="98" y="678" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#93c5fd">Clinic admin</text>

  <!-- main content area -->
  <rect x="260" y="76" width="900" height="636" fill="#f8fafc"/>

  <!-- top header bar -->
  <rect x="260" y="76" width="900" height="56" fill="#ffffff"/>
  <line x1="260" y1="132" x2="1160" y2="132" stroke="#e2e8f0" stroke-width="1"/>

  <text x="288" y="108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0c2461">Dashboard</text>

  <rect x="780" y="92" width="240" height="24" rx="12" fill="#f1f5f9"/>
  <text x="796" y="108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">Search patients, orders…</text>

  <circle cx="1060" cy="104" r="12" fill="#fef3c7"/>
  <text x="1060" y="108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#b45309" font-weight="700" text-anchor="middle">3</text>

  <circle cx="1100" cy="104" r="12" fill="#dbeafe"/>
  <circle cx="1140" cy="104" r="12" fill="#dbeafe"/>

  <!-- stat cards row -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(288, 156)">
      <rect width="200" height="92" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="16" y="28" font-size="10" fill="#475569" letter-spacing="0.8">PATIENTS TODAY</text>
      <text x="16" y="60" font-size="26" font-weight="700" fill="#0c2461">142</text>
      <text x="16" y="80" font-size="10" fill="#16a34a">↑ 12% vs last week</text>
    </g>

    <g transform="translate(504, 156)">
      <rect width="200" height="92" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="16" y="28" font-size="10" fill="#475569" letter-spacing="0.8">OPEN ADMISSIONS</text>
      <text x="16" y="60" font-size="26" font-weight="700" fill="#0c2461">28</text>
      <text x="16" y="80" font-size="10" fill="#475569">in 4 wards</text>
    </g>

    <g transform="translate(720, 156)">
      <rect width="200" height="92" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="16" y="28" font-size="10" fill="#475569" letter-spacing="0.8">LAB ORDERS PENDING</text>
      <text x="16" y="60" font-size="26" font-weight="700" fill="#0c2461">17</text>
      <text x="16" y="80" font-size="10" fill="#b45309">5 stat</text>
    </g>

    <g transform="translate(936, 156)">
      <rect width="200" height="92" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="16" y="28" font-size="10" fill="#475569" letter-spacing="0.8">PHARMACY DISPENSE</text>
      <text x="16" y="60" font-size="26" font-weight="700" fill="#0c2461">94</text>
      <text x="16" y="80" font-size="10" fill="#16a34a">3 low-stock</text>
    </g>
  </g>

  <!-- chart card -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" transform="translate(288, 270)">
    <rect width="528" height="200" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="30" font-size="13" font-weight="600" fill="#0c2461">Visits — last 14 days</text>
    <text x="20" y="48" font-size="10" fill="#475569">Outpatient + Emergency + Inpatient</text>

    <!-- bar chart (cascaded grow animation) -->
    <g transform="translate(20, 80)">
      <rect x="0" y="100" width="22" height="0" rx="2" fill="#1e40af">
        <animate attributeName="height" from="0" to="40" dur="0.5s" begin="0.2s" fill="freeze"/>
        <animate attributeName="y" from="100" to="60" dur="0.5s" begin="0.2s" fill="freeze"/>
      </rect>
      <rect x="36" y="100" width="22" height="0" rx="2" fill="#1e40af">
        <animate attributeName="height" from="0" to="52" dur="0.5s" begin="0.25s" fill="freeze"/>
        <animate attributeName="y" from="100" to="48" dur="0.5s" begin="0.25s" fill="freeze"/>
      </rect>
      <rect x="72" y="100" width="22" height="0" rx="2" fill="#1e40af">
        <animate attributeName="height" from="0" to="60" dur="0.5s" begin="0.3s" fill="freeze"/>
        <animate attributeName="y" from="100" to="40" dur="0.5s" begin="0.3s" fill="freeze"/>
      </rect>
      <rect x="108" y="100" width="22" height="0" rx="2" fill="#1e40af">
        <animate attributeName="height" from="0" to="44" dur="0.5s" begin="0.35s" fill="freeze"/>
        <animate attributeName="y" from="100" to="56" dur="0.5s" begin="0.35s" fill="freeze"/>
      </rect>
      <rect x="144" y="100" width="22" height="0" rx="2" fill="#1e40af">
        <animate attributeName="height" from="0" to="68" dur="0.5s" begin="0.4s" fill="freeze"/>
        <animate attributeName="y" from="100" to="32" dur="0.5s" begin="0.4s" fill="freeze"/>
      </rect>
      <rect x="180" y="100" width="22" height="0" rx="2" fill="#1e40af">
        <animate attributeName="height" from="0" to="64" dur="0.5s" begin="0.45s" fill="freeze"/>
        <animate attributeName="y" from="100" to="36" dur="0.5s" begin="0.45s" fill="freeze"/>
      </rect>
      <rect x="216" y="100" width="22" height="0" rx="2" fill="#1e40af">
        <animate attributeName="height" from="0" to="56" dur="0.5s" begin="0.5s" fill="freeze"/>
        <animate attributeName="y" from="100" to="44" dur="0.5s" begin="0.5s" fill="freeze"/>
      </rect>
      <rect x="252" y="100" width="22" height="0" rx="2" fill="#3b82f6">
        <animate attributeName="height" from="0" to="76" dur="0.5s" begin="0.55s" fill="freeze"/>
        <animate attributeName="y" from="100" to="24" dur="0.5s" begin="0.55s" fill="freeze"/>
      </rect>
      <rect x="288" y="100" width="22" height="0" rx="2" fill="#3b82f6">
        <animate attributeName="height" from="0" to="64" dur="0.5s" begin="0.6s" fill="freeze"/>
        <animate attributeName="y" from="100" to="36" dur="0.5s" begin="0.6s" fill="freeze"/>
      </rect>
      <rect x="324" y="100" width="22" height="0" rx="2" fill="#3b82f6">
        <animate attributeName="height" from="0" to="84" dur="0.5s" begin="0.65s" fill="freeze"/>
        <animate attributeName="y" from="100" to="16" dur="0.5s" begin="0.65s" fill="freeze"/>
      </rect>
      <rect x="360" y="100" width="22" height="0" rx="2" fill="#3b82f6">
        <animate attributeName="height" from="0" to="72" dur="0.5s" begin="0.7s" fill="freeze"/>
        <animate attributeName="y" from="100" to="28" dur="0.5s" begin="0.7s" fill="freeze"/>
      </rect>
      <rect x="396" y="100" width="22" height="0" rx="2" fill="#3b82f6">
        <animate attributeName="height" from="0" to="60" dur="0.5s" begin="0.75s" fill="freeze"/>
        <animate attributeName="y" from="100" to="40" dur="0.5s" begin="0.75s" fill="freeze"/>
      </rect>
      <rect x="432" y="100" width="22" height="0" rx="2" fill="#3b82f6">
        <animate attributeName="height" from="0" to="80" dur="0.5s" begin="0.8s" fill="freeze"/>
        <animate attributeName="y" from="100" to="20" dur="0.5s" begin="0.8s" fill="freeze"/>
      </rect>
      <rect x="468" y="100" width="22" height="0" rx="2" fill="#3b82f6">
        <animate attributeName="height" from="0" to="88" dur="0.5s" begin="0.85s" fill="freeze"/>
        <animate attributeName="y" from="100" to="12" dur="0.5s" begin="0.85s" fill="freeze"/>
      </rect>
    </g>
    <line x1="20" y1="180" x2="510" y2="180" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- recent activity card -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" transform="translate(832, 270)">
    <rect width="304" height="200" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="30" font-size="13" font-weight="600" fill="#0c2461">Recent activity</text>

    <g transform="translate(20, 56)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.4s" fill="freeze"/>
      <circle cx="6" cy="6" r="4" fill="#16a34a">
        <animate attributeName="r" values="4;5;4" dur="2.4s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <text x="22" y="10" font-size="11" fill="#0f172a">Lab result confirmed</text>
      <text x="22" y="24" font-size="10" fill="#475569">Patient #2941 · just now</text>
    </g>

    <g transform="translate(20, 96)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.7s" fill="freeze"/>
      <circle cx="6" cy="6" r="4" fill="#3b82f6"/>
      <text x="22" y="10" font-size="11" fill="#0f172a">New admission</text>
      <text x="22" y="24" font-size="10" fill="#475569">Ward 3 · Bed 12 · 8 min ago</text>
    </g>

    <g transform="translate(20, 136)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.0s" fill="freeze"/>
      <circle cx="6" cy="6" r="4" fill="#f59e0b"/>
      <text x="22" y="10" font-size="11" fill="#0f172a">Low stock alert</text>
      <text x="22" y="24" font-size="10" fill="#475569">Paracetamol 500mg · 14 min ago</text>
    </g>
  </g>

  <!-- table card -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" transform="translate(288, 492)">
    <rect width="848" height="200" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="30" font-size="13" font-weight="600" fill="#0c2461">Patients waiting in outpatient</text>
    <line x1="0" y1="52" x2="848" y2="52" stroke="#e2e8f0" stroke-width="1"/>

    <g font-size="10" fill="#475569" letter-spacing="0.6">
      <text x="20" y="72">ID</text>
      <text x="120" y="72">PATIENT</text>
      <text x="320" y="72">REASON</text>
      <text x="540" y="72">DOCTOR</text>
      <text x="720" y="72">STATUS</text>
    </g>

    <g font-size="11" fill="#0f172a">
      <line x1="0" y1="86" x2="848" y2="86" stroke="#f1f5f9"/>
      <text x="20" y="106">#2941</text>
      <text x="120" y="106">Aisha M.</text>
      <text x="320" y="106">Follow-up — diabetes</text>
      <text x="540" y="106">Dr. Adamu</text>
      <rect x="720" y="94" width="56" height="18" rx="9" fill="#dcfce7"/>
      <text x="748" y="106" font-size="9" fill="#16a34a" font-weight="600" text-anchor="middle">SEEN</text>

      <line x1="0" y1="118" x2="848" y2="118" stroke="#f1f5f9"/>
      <text x="20" y="138">#2942</text>
      <text x="120" y="138">Mohamed I.</text>
      <text x="320" y="138">Chest pain — urgent</text>
      <text x="540" y="138">Dr. Adamu</text>
      <rect x="720" y="126" width="64" height="18" rx="9" fill="#fef3c7">
        <animate attributeName="fill" values="#fef3c7;#fde68a;#fef3c7" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <text x="752" y="138" font-size="9" fill="#b45309" font-weight="600" text-anchor="middle">WAITING</text>

      <line x1="0" y1="150" x2="848" y2="150" stroke="#f1f5f9"/>
      <text x="20" y="170">#2943</text>
      <text x="120" y="170">Fatima O.</text>
      <text x="320" y="170">Prenatal · routine</text>
      <text x="540" y="170">Dr. Adamu</text>
      <rect x="720" y="158" width="56" height="18" rx="9" fill="#dbeafe"/>
      <text x="748" y="170" font-size="9" fill="#1e40af" font-weight="600" text-anchor="middle">NEW</text>
    </g>
  </g>

  <!-- design preview badge -->
  <g transform="translate(1020, 92)">
    <rect width="120" height="22" rx="11" fill="#1e40af"/>
    <text x="60" y="15" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">DESIGN PREVIEW</text>
  </g>
</svg>
