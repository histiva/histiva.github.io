<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Design preview of CoPilot Triage queue reordering interface">
  <defs>
    <filter id="vt-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0c2461" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#f8fafc"/>

  <!-- phone frame on left, queue list on right -->
  <!-- phone -->
  <g filter="url(#vt-shadow)" transform="translate(40, 50)">
    <rect width="200" height="400" rx="24" fill="#0f172a"/>
    <rect x="6" y="6" width="188" height="388" rx="20" fill="#ffffff"/>
  </g>
  <rect x="116" y="56" width="48" height="14" rx="7" fill="#0f172a"/>
  <rect x="116" y="436" width="48" height="3" rx="1.5" fill="#0f172a"/>

  <!-- phone screen content: triage interview -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="60" y="100" font-size="9" fill="#475569">9:41 AM</text>
    <text x="220" y="100" font-size="10" font-weight="700" fill="#0c2461" text-anchor="end">CoPilot Triage</text>

    <!-- patient avatar + name -->
    <circle cx="80" cy="130" r="18" fill="#dbeafe"/>
    <text x="80" y="135" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">JN</text>
    <text x="108" y="124" font-size="11" font-weight="600" fill="#0f172a">Jane N.</text>
    <text x="108" y="138" font-size="9" fill="#475569">F · 34 · #2944</text>

    <!-- vitals -->
    <rect x="60" y="160" width="160" height="60" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="70" y="178" font-size="8" fill="#b45309" letter-spacing="0.6">VITALS (live)</text>
    <text x="70" y="196" font-size="12" font-weight="700" fill="#0c2461">Temp 39.4°C</text>
    <text x="70" y="210" font-size="9" fill="#475569">HR 118 · SpO2 96% · RR 24</text>

    <!-- spoken Q&A -->
    <rect x="60" y="230" width="160" height="56" rx="6" fill="#f1f5f9"/>
    <circle cx="74" cy="247" r="5" fill="#3b82f6"/>
    <text x="86" y="251" font-size="8" fill="#475569">Onset?</text>
    <text x="70" y="266" font-size="9" font-weight="600" fill="#0f172a">"3 days, getting worse"</text>
    <text x="70" y="278" font-size="7" fill="#94a3b8">+ 2 more answers</text>

    <!-- AI triage recommendation -->
    <rect x="60" y="296" width="160" height="84" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="70" y="314" font-size="8" fill="#b91c1c" letter-spacing="0.6">AI · MANCHESTER SCALE</text>
    <text x="70" y="336" font-size="20" font-weight="800" fill="#b91c1c">URGENT</text>
    <text x="70" y="354" font-size="8" fill="#7f1d1d">Risk: ↑ malaria + dehydration</text>
    <rect x="70" y="362" width="140" height="14" rx="3" fill="#b91c1c"/>
    <text x="140" y="372" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">Move to position 1 →</text>
  </g>

  <!-- queue list on the right -->
  <g filter="url(#vt-shadow)" transform="translate(280, 50)">
    <rect width="480" height="400" rx="14" fill="#ffffff"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="300" y="86" font-size="10" fill="#475569" letter-spacing="0.6">WAITING ROOM · OUTPATIENT</text>
    <text x="300" y="108" font-size="18" font-weight="700" fill="#0c2461">14 patients in queue</text>

    <!-- column headers -->
    <text x="300" y="138" font-size="8" fill="#94a3b8" letter-spacing="0.6">PRIORITY</text>
    <text x="380" y="138" font-size="8" fill="#94a3b8" letter-spacing="0.6">PATIENT</text>
    <text x="560" y="138" font-size="8" fill="#94a3b8" letter-spacing="0.6">REASON</text>
    <text x="720" y="138" font-size="8" fill="#94a3b8" letter-spacing="0.6" text-anchor="end">WAIT</text>

    <line x1="300" y1="146" x2="740" y2="146" stroke="#e2e8f0"/>

    <!-- row 1: NEW priority (jane just promoted) -->
    <rect x="296" y="154" width="448" height="40" rx="6" fill="#fee2e2"/>
    <rect x="296" y="154" width="3" height="40" fill="#b91c1c"/>
    <text x="316" y="178" font-size="11" font-weight="800" fill="#b91c1c">URGENT</text>
    <circle cx="392" cy="174" r="10" fill="#dbeafe"/>
    <text x="392" y="178" font-size="8" font-weight="700" fill="#1e40af" text-anchor="middle">JN</text>
    <text x="408" y="173" font-size="10" font-weight="600" fill="#0f172a">Jane N.</text>
    <text x="408" y="187" font-size="8" fill="#475569">#2944 · 34F</text>
    <text x="560" y="173" font-size="9" fill="#0f172a">Fever 39.4° · 3d</text>
    <text x="560" y="187" font-size="8" fill="#b91c1c">↑ from #8 · just now</text>
    <text x="740" y="178" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="end">38 min</text>

    <!-- row 2: STANDARD -->
    <rect x="296" y="198" width="448" height="36" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="296" y="198" width="3" height="36" fill="#16a34a"/>
    <text x="316" y="220" font-size="9" font-weight="700" fill="#16a34a">STANDARD</text>
    <circle cx="392" cy="216" r="9" fill="#dbeafe"/>
    <text x="392" y="220" font-size="7" font-weight="700" fill="#1e40af" text-anchor="middle">AM</text>
    <text x="408" y="220" font-size="10" font-weight="600" fill="#0f172a">Aisha M.</text>
    <text x="560" y="220" font-size="9" fill="#475569">Diabetes follow-up</text>
    <text x="740" y="220" font-size="10" fill="#475569" text-anchor="end">22 min</text>

    <!-- row 3 -->
    <rect x="296" y="238" width="448" height="36" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="296" y="238" width="3" height="36" fill="#16a34a"/>
    <text x="316" y="260" font-size="9" font-weight="700" fill="#16a34a">STANDARD</text>
    <circle cx="392" cy="256" r="9" fill="#dbeafe"/>
    <text x="392" y="260" font-size="7" font-weight="700" fill="#1e40af" text-anchor="middle">FO</text>
    <text x="408" y="260" font-size="10" font-weight="600" fill="#0f172a">Fatima O.</text>
    <text x="560" y="260" font-size="9" fill="#475569">Prenatal · routine</text>
    <text x="740" y="260" font-size="10" fill="#475569" text-anchor="end">18 min</text>

    <!-- row 4 -->
    <rect x="296" y="278" width="448" height="36" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="296" y="278" width="3" height="36" fill="#f59e0b"/>
    <text x="316" y="300" font-size="9" font-weight="700" fill="#b45309">PRIORITY</text>
    <circle cx="392" cy="296" r="9" fill="#fef3c7"/>
    <text x="392" y="300" font-size="7" font-weight="700" fill="#b45309" text-anchor="middle">MI</text>
    <text x="408" y="300" font-size="10" font-weight="600" fill="#0f172a">Mohamed I.</text>
    <text x="560" y="300" font-size="9" fill="#475569">Chest pain</text>
    <text x="740" y="300" font-size="10" fill="#475569" text-anchor="end">9 min</text>

    <!-- row 5 -->
    <rect x="296" y="318" width="448" height="36" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="296" y="318" width="3" height="36" fill="#16a34a"/>
    <text x="316" y="340" font-size="9" font-weight="700" fill="#16a34a">STANDARD</text>
    <circle cx="392" cy="336" r="9" fill="#dbeafe"/>
    <text x="392" y="340" font-size="7" font-weight="700" fill="#1e40af" text-anchor="middle">JK</text>
    <text x="408" y="340" font-size="10" font-weight="600" fill="#0f172a">Joseph K.</text>
    <text x="560" y="340" font-size="9" fill="#475569">Lab review</text>
    <text x="740" y="340" font-size="10" fill="#475569" text-anchor="end">4 min</text>

    <!-- more indicator -->
    <text x="520" y="386" font-size="9" fill="#94a3b8" text-anchor="middle">+ 9 more patients</text>
  </g>

  <!-- preview badge -->
  <g transform="translate(640, 16)">
    <rect width="120" height="22" rx="11" fill="#1e40af"/>
    <text x="60" y="15" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">DESIGN PREVIEW</text>
  </g>
</svg>
