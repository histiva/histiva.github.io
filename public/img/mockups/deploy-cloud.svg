<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Design preview of Histiva cloud deployment console">
  <defs>
    <filter id="cs" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0c2461" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="400" height="250" fill="#f8fafc"/>

  <!-- browser window -->
  <g filter="url(#cs)">
    <rect x="16" y="16" width="368" height="218" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- chrome -->
    <rect x="16" y="16" width="368" height="22" rx="8" fill="#e2e8f0"/>
    <rect x="16" y="30" width="368" height="8" fill="#e2e8f0"/>
    <circle cx="28" cy="27" r="3" fill="#ef4444"/>
    <circle cx="38" cy="27" r="3" fill="#f59e0b"/>
    <circle cx="48" cy="27" r="3" fill="#10b981"/>
    <rect x="120" y="22" width="160" height="10" rx="5" fill="#ffffff"/>
    <text x="125" y="29" font-family="ui-sans-serif, system-ui, sans-serif" font-size="6" fill="#475569">app.histiva.health/console</text>
  </g>

  <!-- console body -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="32" y="58" font-size="11" font-weight="700" fill="#0c2461">Cloud deployment</text>
    <text x="32" y="72" font-size="8" fill="#475569">Managed regions · 3 active</text>

    <!-- region card 1 -->
    <g transform="translate(32, 88)">
      <rect width="108" height="56" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
      <text x="10" y="16" font-size="7" fill="#1e40af" letter-spacing="0.6">EU · FRANKFURT</text>
      <text x="10" y="34" font-size="11" font-weight="700" fill="#0c2461">eu-central-1</text>
      <circle cx="14" cy="46" r="2.5" fill="#16a34a"/>
      <text x="22" y="49" font-size="7" fill="#475569">Healthy · 99.97%</text>
    </g>

    <!-- region card 2 -->
    <g transform="translate(146, 88)">
      <rect width="108" height="56" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="10" y="16" font-size="7" fill="#1e40af" letter-spacing="0.6">US · OHIO</text>
      <text x="10" y="34" font-size="11" font-weight="700" fill="#0c2461">us-east-2</text>
      <circle cx="14" cy="46" r="2.5" fill="#16a34a"/>
      <text x="22" y="49" font-size="7" fill="#475569">Healthy · 99.99%</text>
    </g>

    <!-- region card 3 -->
    <g transform="translate(260, 88)">
      <rect width="108" height="56" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="10" y="16" font-size="7" fill="#1e40af" letter-spacing="0.6">AS · SINGAPORE</text>
      <text x="10" y="34" font-size="11" font-weight="700" fill="#0c2461">ap-southeast-1</text>
      <circle cx="14" cy="46" r="2.5" fill="#f59e0b"/>
      <text x="22" y="49" font-size="7" fill="#475569">Scaling up</text>
    </g>

    <!-- toggles row -->
    <g transform="translate(32, 160)">
      <text x="0" y="12" font-size="9" fill="#0f172a">Auto-backups</text>
      <rect x="80" y="2" width="22" height="12" rx="6" fill="#1e40af"/>
      <circle cx="96" cy="8" r="5" fill="#ffffff"/>

      <text x="140" y="12" font-size="9" fill="#0f172a">PII anonymized</text>
      <rect x="240" y="2" width="22" height="12" rx="6" fill="#1e40af"/>
      <circle cx="256" cy="8" r="5" fill="#ffffff"/>
    </g>

    <g transform="translate(32, 184)">
      <text x="0" y="12" font-size="9" fill="#0f172a">BYOC (your AWS)</text>
      <rect x="80" y="2" width="22" height="12" rx="6" fill="#cbd5e1"/>
      <circle cx="86" cy="8" r="5" fill="#ffffff"/>

      <text x="140" y="12" font-size="9" fill="#0f172a">Encryption at rest</text>
      <rect x="240" y="2" width="22" height="12" rx="6" fill="#1e40af"/>
      <circle cx="256" cy="8" r="5" fill="#ffffff"/>
    </g>

    <!-- footer button -->
    <rect x="32" y="208" width="100" height="18" rx="4" fill="#1e40af"/>
    <text x="82" y="220" font-size="8" font-weight="600" fill="#ffffff" text-anchor="middle">Deploy a region</text>
  </g>

  <!-- preview badge -->
  <g transform="translate(290, 50)">
    <rect width="86" height="16" rx="8" fill="#1e40af"/>
    <text x="43" y="11" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">DESIGN PREVIEW</text>
  </g>
</svg>
